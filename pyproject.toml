[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devirank"
version = "0.1.0"
description = "Evidence-weighted drug ranking via network-based proximity analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "networkx>=3.1,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
devirank = "scr.run_devirank:main"
devirank-compare = "scr.run_comparison:main"

[tool.setuptools.packages.find]
include = ["scr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "experiments",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
